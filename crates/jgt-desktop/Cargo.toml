[package]
name = "jgt-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "jg-team-dev desktop app"

[[bin]]
name = "jg-team-dev-desktop"
path = "src/main.rs"

[dependencies]
jgt-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
iced.workspace = true
resvg.workspace = true
chrono.workspace = true
rfd.workspace = true
pulldown-cmark = "0.12"
# Same version/features as iced_highlighter, so syntect is compiled once.
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"] }
