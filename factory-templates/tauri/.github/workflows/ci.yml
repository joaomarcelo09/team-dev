name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The template does not commit package-lock.json (it cannot be generated offline).
      # The first project install creates it; switch to `npm ci` once it is committed.
      - run: npm install
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # src-tauri embeds the frontend dist at compile time, so build it before cargo runs.
      - name: Build frontend
        run: npm run build
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Core tests
        working-directory: src-tauri
        run: cargo test -p app-core
      - name: Build app
        working-directory: src-tauri
        run: cargo build
